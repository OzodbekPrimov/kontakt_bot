[project]
name = "kontakt-bot"
version = "0.1.0"
description = "Privacy-first Telegram phone deep-link bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4.0",
    "phonenumbers>=9.0,<10.0",
    "pydantic-settings>=2.10,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
